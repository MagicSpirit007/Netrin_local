name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run approved package install scripts
        run: npm rebuild esbuild

      - name: Biome
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Build at site root
        run: npm run build
        env:
          NETRIN_BASE_PATH: /

      - name: Smoke-check site-root build
        run: npm run smoke -- /

      - name: Build legacy mount
        run: npm run build
        env:
          NETRIN_BASE_PATH: /netrin/

      - name: Smoke-check legacy build
        run: npm run smoke -- /netrin/
